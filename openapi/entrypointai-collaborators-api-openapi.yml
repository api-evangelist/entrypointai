components:
  schemas:
    PostV1CollaboratorsRequest:
      type: object
      properties:
        account_id:
          type: string
          description: Unique identifier of the account which owns the collaborator.
        email:
          type: string
          description: Email address of the collaborator.
        role:
          type: string
          description: One of the following values - admin or editor.
        website_ids:
          type: array
          description: Array of website unique identifiers. This field is only provided if the role is editor.
      required:
      - account_id
      - email
      - role
    DeleteV1CollaboratorsResponse:
      type: object
      properties:
        id:
          type: string
          description: Collaborator identifier (present on successful deletion).
        account_id:
          type: string
          description: Account identifier (present on successful deletion).
        _idx:
          type: integer
          description: Index of the object in the original request array.
        error:
          type: string
          description: Error code when deletion fails for that object.
    GetV1CollaboratorsResponse:
      type: object
      properties:
        results:
          type: array
          description: Array of collaborator objects.
        errors:
          type: array
          description: Array of error objects.
        paging:
          type: object
          description: Paging information indicating if more results are available.
    PostV1CollaboratorsResponse:
      type: object
      properties:
        _idx:
          type: integer
          description: Index in the original array of objects posted.
        id:
          type: string
          description: Unique identifier of the collaborator.
        account_id:
          type: string
          description: Unique identifier of the account which owns the collaborator.
        email:
          type: string
          description: Email address of the collaborator.
        first_name:
          type: string
          description: Given name of the collaborator if provided.
        last_name:
          type: string
          description: Surname of the collaborator if provided.
        invitation_url:
          type: string
          description: URL sent to the collaborator to activate their account; null if accepted.
        invitation_status:
          type: string
          description: Indicates whether the invite has been accepted (pending or accepted).
        role:
          type: string
          description: One of the following values - admin or editor.
        website_ids:
          type: array
          description: Array of website unique identifiers; only provided if the role is editor.
        error:
          type: string
          description: Error code when a collaborator cannot be created.
        validation_errors:
          type: array
          description: Array of validation error objects when the error is a validation error.
  securitySchemes:
    API_Key:
      type: apiKey
      in: header
      name: Authorization
      x-source: https://docs.termly.io/introduction/authentication/
