      tags:
      - Collaborators
      summary: Create one or more collaborators
      description: Create one or more collaborators by posting an array of collaborator objects.
      x-source: https://docs.termly.io/endpoints/collaborators-post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostV1CollaboratorsRequest'
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV1CollaboratorsResponse'
