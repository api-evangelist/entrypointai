paths:
  /v1/collaborators:
    delete:
      operationId: delete_v1_collaborators
      tags:
      - Collaborators
      summary: Delete 1 or more collaborators
      description: The DELETE endpoint removes one or more collaborators specified via the `query` parameter. The response is an array where each element corresponds to a request object, containing either success fields (`id`, `account_id`, `_idx`) or an `error` field with `_idx`.
      x-source: https://docs.termly.io/endpoints/collaborators-delete
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: 'URL‑encoded JSON array of objects each containing at least an "account_id" and optionally an "id". Example: [{"account_id":"acct_1234","id":"col_1234"}]'
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteV1CollaboratorsResponse'
      x-evidence:
        kind: documentation
    get:
      operationId: get_v1_collaborators
      tags:
      - Collaborators
      summary: Retrieve all or some of the collaborators for the specified query
      description: 'The response has the shape: { "results" : [], "errors" : [], "paging" : {} }. Each result object contains fields such as id, account_id, email, first_name, last_name, invitation_url, invitation_status, role, and website_ids as documented.'
      x-source: https://docs.termly.io/endpoints/collaborators-get
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: 'A URL‑encoded JSON array describing the query. Example: [{"account_id":"acct_1234","ids":["col_12","col_34"]}]'
      responses:
