          description: name of the default theme to be used
        display_style:
          type: string
          description: style of the banner*
        size:
          type: string
          description: size of the banner*
        personalized_content:
          type: boolean
          description: does the website have content personalized for the user?
        running_targeted_advertising:
          type: boolean
          description: are there targeted advertisements on the website?
        share_data_to_3rd_party:
          type: boolean
          description: does the Website share data with third parties?
        selected_languages:
          type: array
          description: languages the banner will auto display in based on region
        regions:
          type: object
          description: region specific settings
      required:
