components:
  schemas:
    PutV1V1IdRequest:
      type: object
      properties:
        id:
          type: string
          description: unique identifier of the website (the website will always and only have 1 banner so use the website id)
        account_id:
          type: string
          description: unique identifier of the account
        website_id:
          type: string
          description: unique identifier of the website
        theme_id:
          type: string
          description: unique identifier for the custom theme, if theme_id is nil then default_theme is used
